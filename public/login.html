<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign In — PAYME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0B1020;
      --bg-light: #F6F8FC;
      --accent-blue: #2563EB;
      --accent-blue-hover: #1D4ED8;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-card: 0 20px 40px -15px rgba(37, 99, 235, 0.08), 0 10px 25px -10px rgba(11, 16, 32, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-light);
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      padding: 40px 32px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* BRAND LOGO HEADER */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--bg-dark);
      text-decoration: none;
      letter-spacing: -0.04em;
      display: inline-block;
      margin-bottom: 12px;
    }
    .brand-logo span { color: var(--accent-blue); }

    .card-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--bg-dark);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .card-subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
    }

    /* FORM STYLES */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 500;
      background: #FAFAFC;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-blue);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .btn-submit {
      width: 100%;
      height: 52px;
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.35);
    }

    .btn-submit:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      background: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
      animation: fadeIn 0.3s ease;
    }

    .auth-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .auth-footer a {
      color: var(--accent-blue);
      font-weight: 700;
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- PAYME LOGO HEADER -->
    <div class="brand-header">
      <a href="/" class="brand-logo">PAYME<span>.</span></a>
      <h2 class="card-title">Welcome back</h2>
      <p class="card-subtitle">Sign in to continue to your account.</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginIdentifier">Username or Email</label>
        <input type="text" id="loginIdentifier" placeholder="Enter username or email" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/signup.html">Create one</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const loginIdentifier = document.getElementById('loginIdentifier').value;
      const password = document.getElementById('password').value;

      // Loading State
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginIdentifier, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');

        // REDIRECT TO DASHBOARD UPON SUCCESS
        window.location.href = '/dashboard.html';

      } catch (err) {
        alertBox.innerText = err.message;
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    });
  </script>

</body>
</html>
