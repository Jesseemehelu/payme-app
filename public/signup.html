<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PAYME — Signing in</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050713;--card:#0d1427;--blue:#38bdf8;--violet:#8b5cf6;--pink:#ec4899;--text:#fff;--muted:#9aa8c2;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;width:100%}body{font-family:Plus Jakarta Sans,Arial,sans-serif;background:radial-gradient(circle at 15% 5%,rgba(56,189,248,.18),transparent 32%),radial-gradient(circle at 90% 20%,rgba(139,92,246,.2),transparent 35%),linear-gradient(160deg,#050713,#09051a 55%,#03040a);color:var(--text);display:grid;place-items:center;padding:calc(20px + var(--safe-top)) 18px calc(20px + var(--safe-bottom));overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%);pointer-events:none}
.auth-scene{width:min(100%,390px);text-align:center;position:relative;z-index:2}.brand{font-weight:900;letter-spacing:-.07em;font-size:1.65rem}.brand span{color:var(--blue);text-shadow:0 0 20px rgba(56,189,248,.5)}
.loader-orb{width:112px;height:112px;margin:25px auto 20px;border-radius:34px;display:grid;place-items:center;background:linear-gradient(145deg,#17264a,#0a1022);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 45px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.16);animation:orbFloat 2.2s ease-in-out infinite}.loader-orb:before{content:"";width:68px;height:68px;border-radius:50%;border:4px solid rgba(255,255,255,.08);border-top-color:var(--blue);border-right-color:var(--pink);animation:spin 1s linear infinite}.loader-icon{position:absolute;font-size:1.9rem;filter:drop-shadow(0 5px 8px rgba(0,0,0,.5))}
.status-title{font-size:1.05rem;font-weight:900;letter-spacing:-.03em}.status-sub{font-size:.68rem;color:var(--muted);line-height:1.5;margin-top:6px}.dots{display:flex;justify-content:center;gap:5px;margin-top:14px}.dots i{width:6px;height:6px;border-radius:50%;background:#67e8f9;animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.language-modal{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(2,4,12,.78);backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:.25s;z-index:10}.language-modal.show{opacity:1;visibility:visible}.language-card{width:min(100%,360px);padding:22px;border-radius:28px;background:linear-gradient(155deg,#16203b,#0b1020 65%,#160d27);border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14);transform:translateY(20px) scale(.94);transition:.4s cubic-bezier(.16,1,.3,1)}.language-modal.show .language-card{transform:none}.lang-icon{width:54px;height:54px;margin:0 auto 12px;border-radius:17px;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(145deg,var(--blue),var(--violet),var(--pink));box-shadow:0 10px 25px rgba(124,58,237,.35)}.language-card h2{font-size:1.2rem}.language-card p{font-size:.67rem;color:var(--muted);line-height:1.5;margin:6px 0 15px}.lang-list{display:grid;gap:8px}.lang-btn{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-radius:15px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055);color:#fff;font-size:.72rem;font-weight:800}.lang-btn:active{transform:scale(.98);background:rgba(56,189,248,.15)}.lang-btn span:last-child{color:#67e8f9;font-size:.55rem}
.success-flash{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,rgba(56,189,248,.2),rgba(4,5,12,.96) 58%);opacity:0;visibility:hidden;z-index:20}.success-flash.show{opacity:1;visibility:visible;animation:fadeIn .25s ease}.success-core{font-size:2.8rem;animation:successPop .7s cubic-bezier(.16,1.3,.3,1)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes orbFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1.15)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes successPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* ===== MODERN BOUNCY LANGUAGE + SIGN-IN LOADING ===== */
.language-modal{background:rgba(2,4,12,.82)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important}
.language-card{position:relative;overflow:hidden!important;border-radius:31px!important;padding:25px 21px 21px!important;background:linear-gradient(155deg,#192542,#0a1020 64%,#160d29)!important;box-shadow:0 35px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.16)!important}
.language-modal.show .language-card{animation:languageBounce .65s cubic-bezier(.16,1.35,.3,1) both}
@keyframes languageBounce{0%{opacity:0;transform:translateY(38px) scale(.82) rotate(-2deg)}60%{opacity:1;transform:translateY(-8px) scale(1.035) rotate(.6deg)}82%{transform:translateY(3px) scale(.985) rotate(-.25deg)}100%{transform:translateY(0) scale(1) rotate(0)}}
.language-card:before{content:"";position:absolute;inset:-55% -25% auto auto;width:270px;height:270px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.16),transparent 68%);pointer-events:none}
.lang-icon{position:relative;animation:languageIconBounce 2s ease-in-out infinite!important}
@keyframes languageIconBounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.lang-list{position:relative;z-index:2}
.lang-btn{transform:translateY(10px);opacity:0;animation:langItemIn .5s cubic-bezier(.16,1,.3,1) forwards}
.lang-btn:nth-child(1){animation-delay:.08s}.lang-btn:nth-child(2){animation-delay:.14s}.lang-btn:nth-child(3){animation-delay:.20s}.lang-btn:nth-child(4){animation-delay:.26s}.lang-btn:nth-child(5){animation-delay:.32s}
@keyframes langItemIn{to{opacity:1;transform:translateY(0)}}
.lang-btn{position:relative;overflow:hidden;transition:transform .18s ease,background .18s ease,box-shadow .18s ease!important}
.lang-btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%);transform:translateX(-120%);animation:langShine 3.2s ease-in-out infinite}
.lang-btn:nth-child(2):before{animation-delay:.4s}.lang-btn:nth-child(3):before{animation-delay:.8s}.lang-btn:nth-child(4):before{animation-delay:1.2s}.lang-btn:nth-child(5):before{animation-delay:1.6s}
@keyframes langShine{0%,65%{transform:translateX(-120%)}82%,100%{transform:translateX(120%)}}
.lang-btn:active{transform:scale(.96)!important;box-shadow:0 0 0 2px rgba(56,189,248,.22),0 9px 20px rgba(0,0,0,.25)!important}

body.auth-loading .language-modal{pointer-events:none}
body.auth-loading .language-card{animation:languageLoadingCard .45s ease both}
@keyframes languageLoadingCard{to{transform:scale(.94);opacity:.18}}
body.auth-loading .lang-btn{pointer-events:none;filter:grayscale(.25);opacity:.45}
.auth-loading-screen{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 42%,rgba(56,189,248,.16),rgba(4,5,12,.97) 60%);opacity:0;visibility:hidden;z-index:50;transition:.25s ease}
.auth-loading-screen.show{opacity:1;visibility:visible}
.auth-loading-card{width:min(100%,300px);text-align:center;padding:27px 22px;border-radius:29px;background:linear-gradient(155deg,#172441,#090f1f);border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.13);animation:authLoaderPop .55s cubic-bezier(.16,1.3,.3,1) both}
@keyframes authLoaderPop{from{transform:scale(.75) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.auth-loading-orb{width:74px;height:74px;margin:0 auto 15px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#17284d,#0b1225);box-shadow:0 16px 35px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);position:relative}
.auth-loading-orb:before{content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:#38bdf8;border-right-color:#ec4899;animation:spin 1s linear infinite}
.auth-loading-orb span{font-size:1.45rem;animation:authIconPulse 1s ease-in-out infinite}
@keyframes authIconPulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.12)}}
.auth-loading-title{font-size:1rem;font-weight:900}
.auth-loading-sub{margin-top:6px;font-size:.66rem;line-height:1.5;color:#9aa8c2}
.auth-loading-dots{display:flex;justify-content:center;gap:5px;margin-top:13px}.auth-loading-dots i{width:6px;height:6px;border-radius:50%;background:#67e8f9;animation:dot 1s infinite}.auth-loading-dots i:nth-child(2){animation-delay:.15s}.auth-loading-dots i:nth-child(3){animation-delay:.3s}

</style>
</head>
<body>
<div class="auth-scene" id="authScene">
  <div class="brand">PAYME<span>.</span></div>
  <div class="loader-orb"><span class="loader-icon">🔐</span></div>
  <div class="status-title" id="statusTitle">Signing you in…</div>
  <div class="status-sub" id="statusSub">Securely connecting your Telegram account to PAYME.</div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>

<div class="language-modal" id="languageModal" aria-hidden="true">
  <div class="language-card">
    <div class="lang-icon">🌐</div>
    <h2>Choose your language</h2>
    <p>Select the language you want to use across PAYME. Your choice will be saved to your account.</p>
    <div class="lang-list">
      <button class="lang-btn" data-lang="en">🇬🇧 English <span>EN</span></button>
      <button class="lang-btn" data-lang="ru">🇷🇺 Русский <span>RU</span></button>
      <button class="lang-btn" data-lang="es">🇪🇸 Español <span>ES</span></button>
      <button class="lang-btn" data-lang="hi">🇮🇳 हिन्दी <span>HI</span></button>
      <button class="lang-btn" data-lang="ar">🇸🇦 العربية <span>AR</span></button>
    </div>
  </div>
</div>
<div class="success-flash" id="successFlash"><div class="success-core">✨</div></div>
<div class="auth-loading-screen" id="authLoadingScreen" aria-hidden="true">
  <div class="auth-loading-card">
    <div class="auth-loading-orb"><span>🚀</span></div>
    <div class="auth-loading-title">Setting up PAYME…</div>
    <div class="auth-loading-sub">Saving your language and securely preparing your dashboard.</div>
    <div class="auth-loading-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<script>
(function(){
'use strict';
const tg=window.Telegram&&window.Telegram.WebApp;
try{tg&&tg.ready();tg&&tg.expand();if(tg&&typeof tg.disableVerticalSwipes==='function')tg.disableVerticalSwipes()}catch(e){}
const langs=['en','ru','es','hi','ar'];
const scene=document.getElementById('authScene'), modal=document.getElementById('languageModal'), title=document.getElementById('statusTitle'), sub=document.getElementById('statusSub'), flash=document.getElementById('successFlash'), loadingScreen=document.getElementById('authLoadingScreen');
let initData='', pending=false;
function startParam(){try{return String(tg?.initDataUnsafe?.start_param||'').trim().toUpperCase()}catch(e){return ''}}
function setText(a,b){if(title)title.textContent=a;if(sub)sub.textContent=b}
function showLanguage(){pending=true;document.body.classList.remove('auth-loading');setText('One quick choice…','Choose your language to finish setting up PAYME.');modal.classList.add('show');modal.setAttribute('aria-hidden','false')}
async function authenticate(language){
  if(!language) pending=false;
  if(!initData){setText('Telegram authentication required','Please reopen PAYME from Telegram.');return}
  setText(language?'Creating your PAYME account…':'Signing you in…',language?'Preparing your wallet and referral link.':'Securely verifying your Telegram session.');
  try{
    const payload={initData,language:language||''};
    const ref=startParam();
    // The server reads Telegram start_param itself. No referral code field/input is exposed to users.
    const response=await fetch('/api/auth/telegram-signup',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await response.json();
    if(!response.ok||!data.success){if(data.needsLanguage){showLanguage();return}throw new Error(data.message||'Authentication failed.')}
    try{localStorage.setItem('hasSignedUp','true');localStorage.setItem('paymeLanguage',data.user?.language||language||'en')}catch(e){}
    modal.classList.remove('show');modal.setAttribute('aria-hidden','true');pending=false;
    document.body.classList.add('auth-loading');
    if(loadingScreen){loadingScreen.classList.add('show');loadingScreen.setAttribute('aria-hidden','false');}
    setText('PAYME is ready','Loading your dashboard…');flash.classList.add('show');
    setTimeout(()=>{window.location.replace('/dashboard.html')},850);
  }catch(err){console.error(err);setText('Unable to sign in',err.message||'Please reopen PAYME and try again.');setTimeout(()=>authenticate(language||''),1800)}
}
function isLocalHost(){try{return /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname)}catch(e){return false}}
function boot(){
  if(!tg||!tg.initData){
    // No real Telegram session (e.g. opened directly in a browser on Termux
    // instead of through the bot). On localhost this is expected during dev,
    // so fall through to the server's local-test bypass instead of dead-ending
    // here. This path never fires on a real deployed host.
    if(isLocalHost()){
      console.warn('[PAYME] No Telegram WebApp context — using local dev bypass.');
      setText('Local test mode','No Telegram session detected — signing in as the local dev tester.');
      initData='local_test';
      authenticate('');
      return;
    }
    setText('Open PAYME from Telegram','This secure sign-in page needs Telegram Web App authentication.');
    return;
  }
  initData=tg.initData;
  // Always authenticate immediately. New users receive a language prompt only after
  // the server confirms that a language is required; returning users go straight in.
  authenticate('');
}
document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>{if(pending)return;pending=true;authenticate(btn.dataset.lang)}));
boot();
})();
</script>
</body>
</html>
