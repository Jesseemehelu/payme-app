<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up - PAYME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0B0F19;
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Modern Mesh Background Effect */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.15) 0%, transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .signup-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .signup-header { margin-bottom: 28px; }
        
        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .signup-header h1 { 
            font-size: 1.75rem; 
            font-weight: 800; 
            color: #FFFFFF; 
            margin-bottom: 8px;
            letter-spacing: -0.02em; 
        }

        .signup-header p { 
            color: #94A3B8; 
            font-size: 0.9rem; 
            line-height: 1.4;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15); 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            color: #FCA5A5;
            font-size: 0.85rem; 
            padding: 12px 16px; 
            border-radius: 14px; 
            margin-bottom: 24px;
            display: none; 
            font-weight: 600; 
            word-break: break-word;
            text-align: left;
        }

        /* TELEGRAM BUTTON */
        .btn-telegram {
            width: 100%;
            background: linear-gradient(135deg, #229ED9, #1C8AC2);
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(34, 158, 217, 0.3);
            margin-bottom: 24px;
        }

        .btn-telegram:hover { 
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(34, 158, 217, 0.4);
        }
        
        .btn-telegram:active { transform: translateY(0); }
        .btn-telegram:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-telegram svg { width: 22px; height: 22px; fill: currentColor; }

        /* OPTIONAL REFERRAL BOX */
        .referral-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 24px;
            text-align: left;
        }

        .referral-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #CBD5E1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6); 
            color: #FFFFFF;
            font-size: 0.95rem; 
            outline: none; 
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-control::placeholder { color: #64748B; }

        .form-control:focus { 
            border-color: #38BDF8; 
            background: rgba(15, 23, 42, 0.9); 
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); 
        }

        /* FOOTER TERMS & LINK */
        .terms-notice {
            font-size: 0.78rem;
            color: #64748B;
            line-height: 1.5;
        }

        .terms-notice a {
            color: #38BDF8;
            text-decoration: none;
        }

        /* ONBOARDING ANIMATION OVERLAY */
        #onboardingModal {
            position: fixed; inset: 0; background: #0B0F19; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center; padding: 24px; color: #FFFFFF;
            overflow: hidden; opacity: 0; transition: opacity 0.4s ease;
        }

        #onboardingModal.active { display: flex; opacity: 1; }

        .brand-title { font-size: 1.8rem; font-weight: 800; color: #FFFFFF; margin-bottom: 24px; letter-spacing: -0.02em; }
        .brand-title span { color: #38BDF8; }

        .wallet-stage { position: relative; width: 140px; height: 140px; margin-bottom: 24px; display: flex; justify-content: center; align-items: center; }

        .digital-wallet {
            width: 100px; height: 80px; background: linear-gradient(135deg, #2563EB, #1D4ED8);
            border-radius: 16px; position: relative; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            display: flex; align-items: center; justify-content: flex-end; padding-right: 12px;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.2);
        }

        .digital-wallet::after {
            content: ''; width: 14px; height: 14px; background: #38BDF8; border-radius: 50%;
            box-shadow: 0 0 10px #38BDF8;
        }

        .wallet-glow {
            position: absolute; inset: 15px; border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(11, 16, 32, 0) 70%);
            opacity: 0; transition: opacity 0.4s ease;
        }

        .coin {
            position: absolute; font-weight: 800; font-size: 1.2rem; color: #38BDF8;
            opacity: 0; transform: translateY(-60px) scale(0.5);
        }

        @keyframes dropCoin {
            0% { opacity: 0; transform: translateY(-70px) scale(0.5); }
            50% { opacity: 1; transform: translateY(-10px) scale(1.1); }
            100% { opacity: 0; transform: translateY(10px) scale(0.2); }
        }

        .anim-badge {
            font-size: 1.6rem; font-weight: 800; color: #38BDF8; margin-bottom: 8px;
            opacity: 0; transform: translateY(10px); transition: all 0.4s ease;
        }

        .anim-heading {
            font-size: 1.4rem; font-weight: 800; color: #FFFFFF; margin-bottom: 8px;
            opacity: 0; transform: translateY(10px); transition: all 0.4s ease;
        }

        .anim-subtext {
            font-size: 0.9rem; color: #94A3B8; max-width: 280px; line-height: 1.5; margin-bottom: 24px;
            opacity: 0; transform: translateY(10px); transition: all 0.4s ease;
        }

        .btn-continue {
            background: #2563EB; color: #FFFFFF; border: none; padding: 14px 28px;
            border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            opacity: 0; transform: translateY(10px); transition: all 0.4s ease; pointer-events: none;
        }

        .btn-continue.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="signup-header">
        <div class="brand-logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
            </svg>
        </div>
        <h1>Welcome to PAYME</h1>
        <p>Sign up securely with Telegram to access your account instantly.</p>
    </div>

    <div class="alert-error" id="errorBox"></div>

    <!-- TELEGRAM SIGN UP BUTTON -->
    <button type="button" class="btn-telegram" id="telegramSignUpBtn" onclick="handleTelegramAuth()">
        <svg viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.161-2.02 9.53c-.15.68-.56.84-1.13.531-3.1-2.28-1.5 1.44c-.17.17-.31.31-.63.311.22-3.17 5.77-5.21c.25-.22-.05-.34-.39-.121-7.14 4.5-3.07-.96c-.67-.21-.68-.67.14-.991 12.01-4.63c.56-.21 1.05.13.84.99z"/>
        </svg>
        <span id="telegramBtnText">Sign Up with Telegram</span>
    </button>

    <!-- OPTIONAL REFERRAL CODE BOX -->
    <div class="referral-section">
        <label for="referralCode" class="referral-label">Referral Code (Optional)</label>
        <input type="text" id="referralCode" class="form-control" placeholder="e.g. REF123" uppercase>
    </div>

    <p class="terms-notice">
        By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </p>
</div>

<!-- FULLSCREEN ANIMATION OVERLAY -->
<div id="onboardingModal">
    <div class="brand-title">Welcome to <span>PAYME</span></div>
    <div class="wallet-stage">
        <div class="wallet-glow" id="walletGlow"></div>
        <div class="coin" id="coin1" style="left: 30%;">₦</div>
        <div class="coin" id="coin2" style="left: 50%;">₦</div>
        <div class="coin" id="coin3" style="left: 70%;">₦</div>
        <div class="digital-wallet" id="wallet"></div>
    </div>
    <div class="anim-badge" id="animBadge">+ ₦10.00</div>
    <div class="anim-heading" id="animHeading">Congratulations!</div>
    <div class="anim-subtext" id="animSubtext">You've received your ₦10 welcome bonus. Your PAYME journey starts now.</div>
    <button class="btn-continue" id="continueBtn" onclick="redirectDashboard()">Continue to PAYME</button>
</div>

<script>
let tg = null;

function initializeTelegram() {
    try {
        tg = window.Telegram?.WebApp || null;
        if (!tg) return;
        
        if (typeof tg.ready === 'function') tg.ready();
        if (typeof tg.expand === 'function') tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            const telegramUsername = user.username || `user_${user.id}`;
            const telegramBtnText = document.getElementById('telegramBtnText');
            if (telegramBtnText) {
                telegramBtnText.innerText = `Continue as @${telegramUsername}`;
            }
        }
    } catch (error) {
        console.error('Telegram initialization error:', error);
    }
}

window.addEventListener('DOMContentLoaded', () => {
    initializeTelegram();

    // Auto-fill referral code from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const refParam = urlParams.get('ref');
    if (refParam) {
        document.getElementById('referralCode').value = refParam.trim();
    }
});

async function handleTelegramAuth() {
    const errorBox = document.getElementById('errorBox');
    const tgBtn = document.getElementById('telegramSignUpBtn');
    const tgBtnText = document.getElementById('telegramBtnText');
    errorBox.style.display = 'none';

    const activeTg = window.Telegram?.WebApp || tg;

    if (!activeTg) {
        errorBox.innerText = 'Telegram WebApp could not be detected. Please open this page from inside your Telegram Mini App.';
        errorBox.style.display = 'block';
        return;
    }

    try {
        if (typeof activeTg.ready === 'function') activeTg.ready();
        if (typeof activeTg.expand === 'function') activeTg.expand();

        const telegramUser = activeTg.initDataUnsafe?.user;

        if (!telegramUser || !telegramUser.id) {
            errorBox.innerText = 'Telegram account information could not be detected. Please relaunch the Web App directly from Telegram.';
            errorBox.style.display = 'block';
            return;
        }

        tgBtn.disabled = true;
        tgBtnText.innerText = 'Creating account...';

        const payload = {
            initData: activeTg.initData || "",
            telegramId: String(telegramUser.id),
            username: telegramUser.username || `user_${telegramUser.id}`,
            firstName: telegramUser.first_name || "",
            lastName: telegramUser.last_name || "",
            referralCode: document.getElementById('referralCode').value.trim()
        };

        const response = await fetch('/api/auth/telegram-signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || data.error || 'Telegram authentication failed.');
        }

        triggerOnboardingAnimation();
    } catch (error) {
        console.error('Telegram auth error:', error);
        tgBtn.disabled = false;
        tgBtnText.innerText = 'Sign Up with Telegram';
        errorBox.innerText = error.message || 'Telegram authentication failed.';
        errorBox.style.display = 'block';
    }
}

function redirectDashboard() {
    window.location.href = '/dashboard.html';
}

function triggerOnboardingAnimation() {
    const modal = document.getElementById('onboardingModal');
    const walletGlow = document.getElementById('walletGlow');
    const animBadge = document.getElementById('animBadge');
    const animHeading = document.getElementById('animHeading');
    const animSubtext = document.getElementById('animSubtext');
    const continueBtn = document.getElementById('continueBtn');

    modal.classList.add('active');

    setTimeout(() => { document.getElementById('coin1').style.animation = 'dropCoin 0.8s ease-in forwards'; }, 300);
    setTimeout(() => { document.getElementById('coin2').style.animation = 'dropCoin 0.8s ease-in 0.2s forwards'; }, 500);
    setTimeout(() => { document.getElementById('coin3').style.animation = 'dropCoin 0.8s ease-in 0.4s forwards'; }, 700);

    setTimeout(() => {
        walletGlow.style.opacity = '1';
        animBadge.style.opacity = '1';
        animBadge.style.transform = 'translateY(0)';
    }, 1400);

    setTimeout(() => {
        animHeading.style.opacity = '1';
        animHeading.style.transform = 'translateY(0)';
        animSubtext.style.opacity = '1';
        animSubtext.style.transform = 'translateY(0)';
        continueBtn.classList.add('show');
    }, 2000);

    setTimeout(() => { redirectDashboard(); }, 4500);
}
</script>
</body>
</html>
